name: Build AndroidFairy

on:
  workflow_dispatch:

jobs:
  AndroidFairy:
    name: AndroidFairy ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Fairy-Stockfish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required packages
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y zip file

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "========================================"
          echo "Android NDK"
          echo "========================================"

          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "Android compiler:"
          "$TOOLCHAIN/aarch64-linux-android21-clang++" --version

          echo ""
          echo "Checking compiler..."
          test -x "$TOOLCHAIN/aarch64-linux-android21-clang++"

          echo "Checking llvm-strip..."
          test -x "$TOOLCHAIN/llvm-strip"

          echo ""
          echo "NDK tools OK."

      - name: Download Stockfish network
        working-directory: src
        shell: bash
        run: |
          make net

      - name: Check Android compiler
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          echo "========================================"
          echo "Android compiler"
          echo "========================================"

          which aarch64-linux-android21-clang++

          aarch64-linux-android21-clang++ --version

      - name: Build AndroidFairy
        working-directory: src
        shell: bash
        env:
          EXTRACXXFLAGS: >-
            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections
          EXTRALDFLAGS: >-
            -Wl,--gc-sections
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          echo "========================================"
          echo "Cleaning old build"
          echo "========================================"

          make clean

          echo ""
          echo "========================================"
          echo "Building AndroidFairy"
          echo "========================================"

          make -j"$(nproc)" \
            ARCH=armv8 \
            COMP=ndk \
            optimize=yes \
            build

          echo ""
          echo "========================================"
          echo "Build finished"
          echo "========================================"

          test -f fairy-stockfish

          mv fairy-stockfish androidfairy

          chmod +x androidfairy

          echo "AndroidFairy created successfully."

      - name: Strip AndroidFairy
        working-directory: src
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "========================================"
          echo "Stripping AndroidFairy"
          echo "========================================"

          "$TOOLCHAIN/llvm-strip" --strip-all androidfairy

          test -f androidfairy

          echo "Strip completed."

      - name: Verify AndroidFairy
        working-directory: src
        shell: bash
        run: |
          echo "========================================"
          echo "Binary information"
          echo "========================================"

          file androidfairy

          echo ""
          echo "Binary size:"
          ls -lh androidfairy

          echo ""
          echo "========================================"
          echo "UCI test"
          echo "========================================"

          printf 'uci\nisready\nquit\n' | ./androidfairy

          echo ""
          echo "UCI test completed."

      - name: Create AndroidFairy package
        shell: bash
        run: |
          echo "========================================"
          echo "Creating release package"
          echo "========================================"

          rm -rf release

          mkdir -p release

          cp src/androidfairy release/androidfairy

          chmod +x release/androidfairy

          printf '%s\n' \
            'AndroidFairy ARM64' \
            'Fairy-Stockfish Android build' \
            'Architecture: ARM64 / ARMv8' \
            'Target: Android' \
            'Optimized release build' \
            > release/README.txt

          cd release

          zip -9 ../androidfairy-android-arm64.zip \
            androidfairy \
            README.txt

          cd ..

          echo ""
          echo "Package created:"
          ls -lh androidfairy-android-arm64.zip

      - name: Upload AndroidFairy
        uses: actions/upload-artifact@v4
        with:
          name: androidfairy-arm64
          path: androidfairy-android-arm64.zip
          if-no-files-found: error
