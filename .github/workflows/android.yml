name: Build Android Binary

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nszin/setup-android-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile Fairy-Stockfish for Android (arm64-v8a)
        run: |
          cd src
          make build ARCH=armv8 COMP=ndk NDK_TOOLCHAIN_DIR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairy-stockfish-android-arm64
          path: src/fairy-stockfish
