name: Build AndroidFairy1

on:
  workflow_dispatch:

jobs:
  build-android:
    name: AndroidFairy ARM64 - Snapdragon 680
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fairy-Stockfish
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          echo "========================================"
          echo " Android NDK"
          echo "========================================"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -f "$TOOLCHAIN/aarch64-linux-android21-clang++"
          test -f "$TOOLCHAIN/llvm-strip"

          echo "Android compiler:"
          "$TOOLCHAIN/aarch64-linux-android21-clang++" --version

      - name: Build AndroidFairy
        working-directory: src
        env:
          EXTRACXXFLAGS: >-
            -flto=full
            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections
          EXTRALDFLAGS: >-
            -flto=full
            -Wl,--gc-sections
        run: |
          echo "========================================"
          echo " Building AndroidFairy"
          echo " Target: ARM64 / ARMv8"
          echo " Device: Huawei nova 11i"
          echo " CPU: Snapdragon 680"
          echo "========================================"

          # Android NDK compiler location
          export NDK_PATH="$ANDROID_NDK_HOME"
          export TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Make aarch64-linux-android21-clang++ available to Make
          export PATH="$TOOLCHAIN:$PATH"

          echo "NDK_PATH=$NDK_PATH"
          echo "TOOLCHAIN=$TOOLCHAIN"

          echo "========================================"
          echo " Checking Android compiler"
          echo "========================================"

          which aarch64-linux-android21-clang++
          aarch64-linux-android21-clang++ --version

          echo "========================================"
          echo " Building"
          echo "========================================"

          make clean

          make -j"$(nproc)" \
            build \
            ARCH=armv8 \
            COMP=ndk \
            optimize=yes

          echo "========================================"
          echo " Renaming"
          echo "========================================"

          mv fairy-stockfish androidfairy
          
      - name: Strip AndroidFairy
        working-directory: src
        run: |
          echo "========================================"
          echo " Stripping binary"
          echo "========================================"

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/llvm-strip" \
            --strip-all \
            androidfairy

          chmod +x androidfairy

      - name: Verify AndroidFairy
        working-directory: src
        run: |
          echo "========================================"
          echo " Binary information"
          echo "========================================"

          file androidfairy

          echo ""
          echo "Binary size:"
          ls -lh androidfairy

          echo ""
          echo "========================================"
          echo " UCI engine test"
          echo "========================================"

          printf "uci\nisready\nquit\n" | ./androidfairy

      - name: Create release package
        run: |
          echo "========================================"
          echo " Creating AndroidFairy package"
          echo "========================================"

          mkdir -p release

          cp src/androidfairy release/androidfairy
          chmod +x release/androidfairy

          cat > release/README.txt <<'EOF'
AndroidFairy
============

Fairy-Stockfish ARM64 Android engine.

Target device:
Huawei nova 11i

CPU:
Qualcomm Snapdragon 680

Architecture:
ARM64 / AArch64
ARMv8
NEON
POPCNT
Prefetch

Optimization:
-O3
LTO
Function/data sections
Linker garbage collection

Binary:
androidfairy

Type:
UCI chess/variant engine
EOF

          cd release

          zip -9 \
            ../androidfairy-android-arm64.zip \
            androidfairy \
            README.txt

      - name: Upload AndroidFairy
        uses: actions/upload-artifact@v4
        with:
          name: androidfairy-arm64
          path: androidfairy-android-arm64.zip
          if-no-files-found: error
